- insert:
    - id: cua-provider-registry
      name: '@deepseek-ai/dsh-computer-use'
    - id: cua
      name: '@deepseek-ai/dsh-experimental-cua-macos'
      disabled: !!js process.platform !== 'darwin'
      config:
        # The Desktop host drops the preset filter (false) because its interactive
        # input admission decides availability; other hosts keep the preset scope.
        agentPreset: !!js "ctx.get('profileContext')?.name === 'desktop' ? false : ['ptc', 'standard', 'cordis']"
    - id: ui-cua
      name: '@deepseek-ai/dsh-cua'
