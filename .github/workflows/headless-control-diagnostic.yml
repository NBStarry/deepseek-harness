name: Headless control diagnostic

# Temporary diagnostic carrier for the Linux headless keepalive retry. It builds the
# original artifacts once, then runs the focused positive and negative controls back
# to back. It runs only when this exact diagnostic branch is pushed; it never opens
# a PR, releases, or writes to master. Keep the run logs and the branch as evidence;
# deletion needs separate authorization under the repository worktree rules.
on:
  push:
    branches: [fix/pr4-headless-control]

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  diagnostic:
    name: headless control diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=${{ runner.temp }}/ms-playwright" >> "$GITHUB_ENV"
          echo "LOG_DIR=${{ runner.temp }}/headless-control" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/headless-control"

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable) and prepare bubblewrap
        run: |
          pnpm install --frozen-lockfile
          bash scripts/prepare-ci-bubblewrap.sh

      - name: Install Playwright browsers
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium webkit

      - name: Build the primary runtime once (original artifact entry)
        run: CI=true pnpm run prepare:primary-runtime --target linux-x64 --output "$RUNNER_TEMP/office-runtime" --cache "$RUNNER_TEMP/office-runtime-downloads"

      # The original consumer lane's artifact build, once. The focused expected
      # test runs below reuse this build; no aggregate/9-gate phase runs here.
      - name: Build artifacts once
        env:
          DSH_BUILD_CLIENT_PROFILE: official
        run: pnpm run build:artifacts

      # Candidate window: 24 comments at 60 ms keep the stream active for ~1.4 s
      # before the final response at ~1.5 s; the 1000 ms idle window stays above
      # the mock's interval. This is test-only execution margin, not a product fix.
      - name: Phase B — focused positive (1000 ms idle, 24 heartbeats)
        id: phase-b
        env:
          DSH_EXAMPLE_MODE: lib
        run: |
          set +e
          log="$LOG_DIR/phaseB.log"
          DSH_HEADLESS_IDLE_MS=1000 DSH_HEADLESS_HEARTBEAT_MS=60 DSH_HEADLESS_HEARTBEATS=24 \
            pnpm exec vitest run --config vitest.expected.config.ts \
              apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts \
              -t 'keeps provider comments alive' > "$log" 2>&1
          rc=$?
          positive_ok=0
          [ "$rc" -eq 0 ] && positive_ok=1
          printf 'phaseB rc=%s positive_ok=%s\n' "$rc" "$positive_ok" | tee -a "$LOG_DIR/phases.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "positive_ok=$positive_ok" >> "$GITHUB_OUTPUT"
          exit 0

      # Negative control: only the first agent request lacks comments; the retry
      # and title requests keep the stream alive, so the loader completes and the
      # original two-request assertion fails. The accepted failure must also carry
      # TIMEOUT + idleTimeout:true from the retry event; any other failure is invalid.
      - name: Phase C — no-first-agent-heartbeat negative control
        id: phase-c
        if: always()
        env:
          DSH_EXAMPLE_MODE: lib
        run: |
          set +e
          log="$LOG_DIR/phaseC.log"
          DSH_HEADLESS_IDLE_MS=1000 DSH_HEADLESS_HEARTBEAT_MS=60 DSH_HEADLESS_HEARTBEATS=24 \
            DSH_HEADLESS_SKIP_FIRST_AGENT_HEARTBEATS=1 \
            pnpm exec vitest run --config vitest.expected.config.ts \
              apps/cli/tests/profiles/headless/tests/headless.expected.e2e.ts \
              -t 'keeps provider comments alive' > "$log" 2>&1
          rc=$?
          idle=0
          count=0
          loader=0
          grep -q 'HEADLESS_DEFAULTS_RETRY_DIAG.*"code":"TIMEOUT".*"idleTimeout":true' "$log" && idle=1
          grep -Eq 'to have a length of 2 but got [3-9]' "$log" && count=1
          grep -q 'HEADLESS_DEFAULTS_REQUEST_DIAG' "$log" && ! grep -q 'did not exit within' "$log" && loader=1
          negative_ok=0
          [ "$rc" -ne 0 ] && [ "$idle" -eq 1 ] && [ "$count" -eq 1 ] && [ "$loader" -eq 1 ] && negative_ok=1
          printf 'phaseC rc=%s idle=%s count2_assertion_failed=%s loader_result=%s negative_ok=%s\n' "$rc" "$idle" "$count" "$loader" "$negative_ok" | tee -a "$LOG_DIR/phases.txt"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "negative_ok=$negative_ok" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verdict
        if: always()
        run: |
          set +e
          [ -f "$LOG_DIR/phases.txt" ] && cat "$LOG_DIR/phases.txt"
          b_outcome='${{ steps.phase-b.outcome }}'
          c_outcome='${{ steps.phase-c.outcome }}'
          if [ "$b_outcome" != 'success' ] || [ "$c_outcome" != 'success' ]; then
            echo "verdict=aborted-before-both-controls-completed (phaseB=$b_outcome phaseC=$c_outcome)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          positive_ok='${{ steps.phase-b.outputs.positive_ok }}'
          negative_ok='${{ steps.phase-c.outputs.negative_ok }}'
          echo "verdict positive_ok=$positive_ok negative_ok=$negative_ok" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$positive_ok" = '1' ] && [ "$negative_ok" = '1' ] && exit 0
          exit 1

      - name: Save logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-control-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/headless-control
          retention-days: 14
