name: Fork coverage diagnostic

# FilesBody navigator fix paired diagnostic: one ff894 baseline and one same-job
# candidate differing only by the reviewed FilesBody CSS patch. No trace/Profiler.
on:
  push:
    branches: [diagnostic/fork-coverage]

permissions:
  contents: read

concurrency:
  group: fork-coverage-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24.22.2'
  TESTED_HEAD: ff894d3e27b85011f609c50f5deef4e4570341e5
  TESTED_TREE: 39618f66d9dcd59c721de9e454888cdc4eeb779e
  TESTED_BENCH_SHA256: c83e6229fa2f5a39f2776c205d69eebe341ebc785bc2e57050e768009a1dfe98
  TESTED_BENCH_AFTER_SHA256: 773c94844fe5680cb30ef432b41f68fcd20d651addd46992227f8de5d891f51e
  TESTED_BENCH_BLOB: 56fc53b60113a2ae5cbd6a45827e158563af3571
  PLANNED_PATCH_SHA256: f84acac63d0c11d3536d44a8cbec8f8b739a8811db13082c01550cad87266d9f
  FILESBODY_BEFORE_SHA256: b412321d7d82be7273349831335f3748723ee9ee083999387615131825b35c2b
  FILESBODY_AFTER_SHA256: 6aca876af6bd4e91a1f13c757ec3cd223383abefde51b92a5660ac05ade5a43b
  FILESBODY_PATCH_SHA256: 7a6808def007f3b920e11c977f28854bc6067e750bc1bb22682ba7f5147291a5
  CHATVIEW_CSS_SHA256: ed939e63d6e6479b7b240a79c3231ade8c32f55235002ac33fc6a085e0497b60
  LOCK_SHA256: 6dbb7b4d0117aa2a69d19e348cb22e2b46eba5b11af146ab24b7a2bcc3a9b86c
  DIAG_BENCH_PATCH_B64: ''
  FILESBODY_PATCH_B64: ''

jobs:
  browser-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout measured baseline (explicit ff894)
        uses: actions/checkout@v7.0.1
        with:
          ref: ff894d3e27b85011f609c50f5deef4e4570341e5
          fetch-depth: 1
          persist-credentials: false

      - name: Record identity and fail closed on drift
        run: |
          DIAG="$RUNNER_TEMP/long-session-overlap"
          mkdir -p "$DIAG"
          tested_head=$(git rev-parse HEAD)
          tested_tree=$(git rev-parse HEAD^{tree})
          tested_blob=$(git hash-object benchmarks/long-session-browser/long-session.bench.ts)
          tested_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          filesbody_sha=$(sha256sum packages/client/ui-sidebar-files/src/client/FilesBody.module.css | cut -d' ' -f1)
          chatview_sha=$(sha256sum packages/client/ui-chat/src/client/chat/ChatView.module.css | cut -d' ' -f1)
          lock_sha=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
          diag_head='${{ github.sha }}'
          diag_tree=unavailable
          if git fetch --depth=1 origin "$diag_head" >/dev/null 2>&1; then
            diag_tree=$(git rev-parse "$diag_head^{tree}" 2>/dev/null || echo unavailable)
          fi
          {
            echo "diag_head=$diag_head"
            echo "diag_tree=$diag_tree"
            echo "tested_head=$tested_head"
            echo "tested_tree=$tested_tree"
            echo "tested_bench_blob=$tested_blob"
            echo "tested_bench_sha256=$tested_sha"
            echo "filesbody_css_before_sha256=$filesbody_sha"
            echo "chatview_css_sha256=$chatview_sha"
            echo "pnpm_lock_sha256=$lock_sha"
            echo "started_at=$(date -u +%FT%TZ)"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "cpu_model=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo "visible_cores=$(nproc)"
            echo "cgroup_cpu_max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unreadable)"
            echo "load_before=$(cat /proc/loadavg)"
            echo "tested_worktree_after_patch_is_exact_396=false"
          } | tee "$DIAG/identity.txt"
          [ "$tested_head" = "$TESTED_HEAD" ] || { echo "tested HEAD drift" >&2; exit 1; }
          [ "$tested_tree" = "$TESTED_TREE" ] || { echo "tested tree drift" >&2; exit 1; }
          [ "$tested_blob" = "$TESTED_BENCH_BLOB" ] || { echo "benchmark blob drift" >&2; exit 1; }
          [ "$tested_sha" = "$TESTED_BENCH_SHA256" ] || { echo "benchmark source hash drift" >&2; exit 1; }
          [ "$filesbody_sha" = "$FILESBODY_BEFORE_SHA256" ] || { echo "FilesBody baseline CSS drift" >&2; exit 1; }
          [ "$chatview_sha" = "$CHATVIEW_CSS_SHA256" ] || { echo "ChatView CSS drift" >&2; exit 1; }
          [ "$lock_sha" = "$LOCK_SHA256" ] || { echo "lockfile drift" >&2; exit 1; }
          sha256sum \
            benchmarks/long-session-browser/long-session.bench.ts \
            benchmarks/long-session-browser/synthetic-history.ts \
            apps/web/tests/scaffold.ts \
            apps/web/tests/support.ts \
            benchmarks/support/calibration.ts \
            vitest.bench.config.ts \
            | tee -a "$DIAG/identity.txt"
          cp /proc/stat "$DIAG/proc-stat-before.txt"
          echo "DIAG_DIR=$DIAG" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Record tool versions
        run: |
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
          } | tee -a "$DIAG_DIR/identity.txt"

      - name: Apply reviewed benchmark diagnostics patch (cloud copy)
        id: patch
        run: |
          set +e
          set -o pipefail
          printf '%s' "$DIAG_BENCH_PATCH_B64" | base64 -d | gzip -d > "$DIAG_DIR/bench.patch"
          status=$?
          before_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          cp benchmarks/long-session-browser/long-session.bench.ts "$DIAG_DIR/bench-before.ts"
          if [ "$status" = "0" ] && [ "$before_sha" = "$TESTED_BENCH_SHA256" ]; then
            git apply --check "$DIAG_DIR/bench.patch" && git apply "$DIAG_DIR/bench.patch"
            status=$?
          else
            status=1
          fi
          after_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          after_blob=$(git hash-object benchmarks/long-session-browser/long-session.bench.ts)
          cp benchmarks/long-session-browser/long-session.bench.ts "$DIAG_DIR/bench-after.ts"
          git diff -- benchmarks/long-session-browser > "$DIAG_DIR/bench-applied.diff" || true
          bench_patch_sha=$(sha256sum "$DIAG_DIR/bench.patch" | cut -d' ' -f1)
          echo "bench_before_sha256=$before_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "bench_after_sha256=$after_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "bench_blob_after_patch=$after_blob" | tee -a "$DIAG_DIR/identity.txt"
          echo "bench_patch_sha256=$bench_patch_sha" | tee -a "$DIAG_DIR/identity.txt"
          [ "$bench_patch_sha" = "$PLANNED_PATCH_SHA256" ] || status=1
          [ "$after_sha" = "$TESTED_BENCH_AFTER_SHA256" ] || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Install benchmark browser and hosted dependencies
        id: browser
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium 2>&1 | tee "$DIAG_DIR/browser-install.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Baseline build (bench artifacts and Web shell)
        id: baseline_build
        continue-on-error: true
        run: |
          set +e
          pnpm run build:bench 2>&1 | tee "$DIAG_DIR/baseline-build.log"
          build_status=${PIPESTATUS[0]}
          pnpm run build:web 2>&1 | tee -a "$DIAG_DIR/baseline-build.log"
          web_status=${PIPESTATUS[0]}
          echo "baseline_build_bench=$build_status baseline_build_web=$web_status" | tee -a "$DIAG_DIR/identity.txt"
          [ "$build_status" = "0" ] && [ "$web_status" = "0" ]
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Verify baseline sidebar-files loaded bundle and selector shape
        id: baseline_artifact
        if: steps.baseline_build.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          status=0
          bundle=packages/client/ui-sidebar-files/lib/client.js
          sha=$(sha256sum "$bundle" | cut -d' ' -f1)
          cp "$bundle" "$DIAG_DIR/sidebar-baseline.js" || status=1
          [ -s "$DIAG_DIR/sidebar-baseline.js" ] || { echo "baseline sidebar bundle copy is missing/empty" >&2; status=1; }
          echo "sidebar_baseline_client_sha256=$sha" | tee -a "$DIAG_DIR/identity.txt"
          node -e '
            const fs = require("node:fs");
            const file = process.argv[process.argv.length - 2];
            const mode = process.argv[process.argv.length - 1];
            const s = fs.readFileSync(file, "utf8").replace(/\s+/g, "");
            const oldAncestor = /:has\(>\.[\w-]+_navigator/.test(s);
            const newFill = /\.[\w-]+_navigator\.[\w-]+_fill~:not\(\.[\w-]+_navigator\)/.test(s);
            const newFillHas = /:not\(\.[\w-]+_navigator\):has\(~\.[\w-]+_navigator\.[\w-]+_fill\)/.test(s);
            const newWhole = /\.[\w-]+_navigator:not\(\.[\w-]+_wholePage\)~:not\(\.[\w-]+_navigator\)/.test(s);
            const newWholeHas = /:not\(\.[\w-]+_navigator\):has\(~\.[\w-]+_navigator:not\(\.[\w-]+_wholePage\)\)/.test(s);
            const vis = s.includes("visibility:hidden");
            const ok = mode === "before"
              ? oldAncestor && !newFill && !newFillHas && !newWhole && !newWholeHas && vis
              : !oldAncestor && newFill && newFillHas && newWhole && newWholeHas && vis;
            console.log(JSON.stringify({ mode, oldAncestor, newFill, newFillHas, newWhole, newWholeHas, visibility: vis, ok }));
            if (!ok) process.exit(1);
          ' "$bundle" before || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Baseline long-session-browser spec (3 samples)
        id: baseline
        if: steps.baseline_build.outputs.status == '0' && steps.browser.outputs.status == '0' && steps.baseline_artifact.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          DSH_BENCH_REPORT_PHASE=all pnpm exec vitest run \
            --config vitest.bench.config.ts --no-file-parallelism --maxWorkers=1 \
            benchmarks/long-session-browser/long-session.bench.ts \
            2>&1 | tee "$DIAG_DIR/baseline-bench.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -d benchmarks/.dsh-report ]; then cp -R benchmarks/.dsh-report "$DIAG_DIR/baseline-report"; fi

      - name: Apply reviewed FilesBody CSS patch (cloud copy)
        id: css_patch
        if: steps.baseline_build.outputs.status == '0' && steps.browser.outputs.status == '0' && steps.baseline_artifact.outputs.status == '0'
        run: |
          set +e
          printf '%s' "$FILESBODY_PATCH_B64" | base64 -d > "$DIAG_DIR/filesbody.patch"
          status=$?
          before_sha=$(sha256sum packages/client/ui-sidebar-files/src/client/FilesBody.module.css | cut -d' ' -f1)
          cp packages/client/ui-sidebar-files/src/client/FilesBody.module.css "$DIAG_DIR/filesbody-before.css"
          if [ "$status" = "0" ] && [ "$before_sha" = "$FILESBODY_BEFORE_SHA256" ]; then
            git apply --check "$DIAG_DIR/filesbody.patch" && git apply "$DIAG_DIR/filesbody.patch"
            status=$?
          else
            status=1
          fi
          after_sha=$(sha256sum packages/client/ui-sidebar-files/src/client/FilesBody.module.css | cut -d' ' -f1)
          cp packages/client/ui-sidebar-files/src/client/FilesBody.module.css "$DIAG_DIR/filesbody-after.css"
          git diff -- packages/client/ui-sidebar-files/src/client/FilesBody.module.css > "$DIAG_DIR/filesbody-applied.diff" || true
          patch_sha=$(sha256sum "$DIAG_DIR/filesbody.patch" | cut -d' ' -f1)
          chatview_sha=$(sha256sum packages/client/ui-chat/src/client/chat/ChatView.module.css | cut -d' ' -f1)
          lock_sha=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
          echo "filesbody_css_after_sha256=$after_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "filesbody_patch_sha256=$patch_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "chatview_css_after_sha256=$chatview_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "lock_after_sha256=$lock_sha" | tee -a "$DIAG_DIR/identity.txt"
          [ "$patch_sha" = "$FILESBODY_PATCH_SHA256" ] || status=1
          [ "$after_sha" = "$FILESBODY_AFTER_SHA256" ] || status=1
          [ "$chatview_sha" = "$CHATVIEW_CSS_SHA256" ] || status=1
          [ "$lock_sha" = "$LOCK_SHA256" ] || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Candidate build after FilesBody patch
        id: candidate_build
        if: steps.baseline_build.outputs.status == '0' && steps.css_patch.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          pnpm run build:bench 2>&1 | tee "$DIAG_DIR/candidate-build.log"
          build_status=${PIPESTATUS[0]}
          pnpm run build:web 2>&1 | tee -a "$DIAG_DIR/candidate-build.log"
          web_status=${PIPESTATUS[0]}
          echo "candidate_build_bench=$build_status candidate_build_web=$web_status" | tee -a "$DIAG_DIR/identity.txt"
          [ "$build_status" = "0" ] && [ "$web_status" = "0" ]
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Verify candidate sidebar-files loaded bundle and selector shape
        id: candidate_artifact
        if: steps.candidate_build.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          status=0
          bundle=packages/client/ui-sidebar-files/lib/client.js
          sha=$(sha256sum "$bundle" | cut -d' ' -f1)
          if [ ! -s "$DIAG_DIR/sidebar-baseline.js" ]; then
            echo "baseline sidebar bundle is missing/empty" >&2
            baseline_sha=missing
            status=1
          else
            baseline_sha=$(sha256sum "$DIAG_DIR/sidebar-baseline.js" | cut -d' ' -f1)
          fi
          cp "$bundle" "$DIAG_DIR/sidebar-candidate.js" || status=1
          [ -s "$DIAG_DIR/sidebar-candidate.js" ] || { echo "candidate sidebar bundle copy is missing/empty" >&2; status=1; }
          echo "sidebar_candidate_client_sha256=$sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "sidebar_baseline_client_sha256=$baseline_sha" | tee -a "$DIAG_DIR/identity.txt"
          [ "$sha" != "$baseline_sha" ] || { echo "candidate bundle did not change" >&2; status=1; }
          node -e '
            const fs = require("node:fs");
            const file = process.argv[process.argv.length - 2];
            const mode = process.argv[process.argv.length - 1];
            const s = fs.readFileSync(file, "utf8").replace(/\s+/g, "");
            const oldAncestor = /:has\(>\.[\w-]+_navigator/.test(s);
            const newFill = /\.[\w-]+_navigator\.[\w-]+_fill~:not\(\.[\w-]+_navigator\)/.test(s);
            const newFillHas = /:not\(\.[\w-]+_navigator\):has\(~\.[\w-]+_navigator\.[\w-]+_fill\)/.test(s);
            const newWhole = /\.[\w-]+_navigator:not\(\.[\w-]+_wholePage\)~:not\(\.[\w-]+_navigator\)/.test(s);
            const newWholeHas = /:not\(\.[\w-]+_navigator\):has\(~\.[\w-]+_navigator:not\(\.[\w-]+_wholePage\)\)/.test(s);
            const vis = s.includes("visibility:hidden");
            const ok = mode === "before"
              ? oldAncestor && !newFill && !newFillHas && !newWhole && !newWholeHas && vis
              : !oldAncestor && newFill && newFillHas && newWhole && newWholeHas && vis;
            console.log(JSON.stringify({ mode, oldAncestor, newFill, newFillHas, newWhole, newWholeHas, visibility: vis, ok }));
            if (!ok) process.exit(1);
          ' "$bundle" after || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Candidate long-session-browser spec (3 samples)
        id: candidate
        if: steps.candidate_build.outputs.status == '0' && steps.browser.outputs.status == '0' && steps.candidate_artifact.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          DSH_BENCH_REPORT_PHASE=all pnpm exec vitest run \
            --config vitest.bench.config.ts --no-file-parallelism --maxWorkers=1 \
            benchmarks/long-session-browser/long-session.bench.ts \
            2>&1 | tee "$DIAG_DIR/candidate-bench.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -d benchmarks/.dsh-report ]; then cp -R benchmarks/.dsh-report "$DIAG_DIR/candidate-report"; fi

      - name: Upload bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: long-session-overlap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/long-session-overlap
          retention-days: 14

      - name: Report separate exits
        if: always()
        run: |
          failed=0
          patch_status='${{ steps.patch.outputs.status }}'
          browser_status='${{ steps.browser.outputs.status }}'
          baseline_build_status='${{ steps.baseline_build.outputs.status }}'
          baseline_artifact_status='${{ steps.baseline_artifact.outputs.status }}'
          baseline_status='${{ steps.baseline.outputs.status }}'
          css_status='${{ steps.css_patch.outputs.status }}'
          candidate_build_status='${{ steps.candidate_build.outputs.status }}'
          candidate_artifact_status='${{ steps.candidate_artifact.outputs.status }}'
          candidate_status='${{ steps.candidate.outputs.status }}'
          for entry in \
            "bench-patch:$patch_status" \
            "browser:$browser_status" \
            "baseline-build:$baseline_build_status" \
            "baseline-artifact:$baseline_artifact_status" \
            "baseline-bench:$baseline_status" \
            "filesbody-patch:$css_status" \
            "candidate-build:$candidate_build_status" \
            "candidate-artifact:$candidate_artifact_status" \
            "candidate-bench:$candidate_status"; do
            echo "${entry%%:*} exit=${entry#*:}"
            [ "${entry#*:}" = "0" ] || failed=1
          done
          echo "Baseline and candidate are separate 3-sample runs; no combined median."
          echo "Benchmark and trace-free exits are diagnostic only; no PASS acceptance is claimed."
          [ "$baseline_artifact_status" = "0" ] || echo "baseline bundle unverified: no paired comparison is claimed"
          [ "$candidate_artifact_status" = "0" ] || echo "candidate bundle unverified: candidate bench is withheld"
          cat "$DIAG_DIR/identity.txt"
          for name in baseline candidate; do
            echo "::group::${name} bench log tail"
            tail -160 "$DIAG_DIR/${name}-bench.log" 2>/dev/null || true
            echo "::endgroup::"
            echo "::group::${name} timeline diagnostics"
            grep -E 'long-session-browser/timeline|long-session-browser/overlap-failure' "$DIAG_DIR/${name}-bench.log" 2>/dev/null || true
            echo "::endgroup::"
          done
          echo "::group::sidebar-files bundle evidence"
          sha256sum "$DIAG_DIR/sidebar-baseline.js" "$DIAG_DIR/sidebar-candidate.js" 2>/dev/null || true
          echo "::endgroup::"
          exit "$failed"
