name: Fork coverage diagnostic

# Push-only, single Linux benchmark/profile diagnostic. The branch filter and
# the read-only permission are the reviewed temporary diagnostic entry; this
# variant runs the normal conversation-fold benchmark first and only then takes
# separate Node CPU profiles. It is not a product candidate or a gate.
# Publication target is the reviewed remote diagnostic ref
# refs/heads/diagnostic/fork-coverage; this local worktree branch name is irrelevant.
# Lead normal-FFs HEAD to that remote ref, which is the trigger below.
on:
  push:
    branches: [diagnostic/fork-coverage]

permissions:
  contents: read

concurrency:
  group: fork-coverage-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24.22.2'

jobs:
  bench-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record source and environment facts
        run: |
          DIAG="$RUNNER_TEMP/fold-cpu-profile"
          mkdir -p "$DIAG"
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "ref=${{ github.ref }}"
            echo "head=$(git rev-parse HEAD)"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "started_at=$(date -u +%FT%TZ)"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "cpu_model=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo "visible_cores=$(nproc)"
            echo "cgroup_cpu_max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unreadable)"
            echo "load_before=$(cat /proc/loadavg)"
          } | tee "$DIAG/meta.txt"
          cp /proc/stat "$DIAG/proc-stat-before.txt"
          sha256sum \
            benchmarks/conversation-fold/conversation-fold.worker.client.ts \
            benchmarks/conversation-fold/conversation-fold.bench.client.ts \
            packages/client/ui-chat/src/client/conversation-nodes/assistant.ts \
            packages/client/ui-conversation/src/client/conversation/assembler.ts \
            benchmarks/support/built-worker.ts \
            benchmarks/tsdown.config.ts \
            vitest.bench.config.ts \
            | tee -a "$DIAG/meta.txt"
          echo "DIAG_DIR=$DIAG" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Record tool versions
        run: |
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
          } | tee -a "$DIAG_DIR/meta.txt"

      - name: Build benchmark artifacts (cloud only)
        id: build
        continue-on-error: true
        run: |
          set +e
          pnpm run build:bench 2>&1 | tee "$DIAG_DIR/build.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Normal five-sample conversation-fold benchmark
        id: normal
        continue-on-error: true
        run: |
          set +e
          DSH_BENCH_REPORT_PHASE=last pnpm exec vitest run \
            --config vitest.bench.config.ts --no-file-parallelism --maxWorkers=1 \
            benchmarks/conversation-fold/conversation-fold.bench.client.ts \
            2>&1 | tee "$DIAG_DIR/normal-bench.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          if [ -d benchmarks/.dsh-report ]; then cp -R benchmarks/.dsh-report "$DIAG_DIR/normal-report"; fi

      - name: Profile the original compiled worker (after the normal samples)
        id: profile
        continue-on-error: true
        run: |
          set +e
          worker="benchmarks/.dsh-build/conversation-fold/conversation-fold.worker.js"
          profile_root="$DIAG_DIR/cpu-profile"
          mkdir -p "$profile_root"
          profile_failed=0
          run_profile() {
            local name="$1"
            shift
            local dir="$profile_root/$name"
            mkdir -p "$dir"
            node --expose-gc --cpu-prof --cpu-prof-dir="$dir" "$worker" "$@" \
              > "$DIAG_DIR/profile-$name.stdout.json" 2> "$DIAG_DIR/profile-$name.stderr.log"
            local status=$?
            echo "$name exit=$status" | tee -a "$DIAG_DIR/profile-status.log"
            [ "$status" = "0" ] || profile_failed=1
          }
          run_profile text-ordinary-16384 streaming text ordinary 262144 16384
          run_profile reasoning-leading-whitespace-16384 streaming reasoning leading-whitespace 262144 16384
          run_profile text-ordinary-4096 streaming text ordinary 262144 4096
          run_profile reasoning-leading-whitespace-4096 streaming reasoning leading-whitespace 262144 4096
          cp /proc/stat "$DIAG_DIR/proc-stat-after-profile.txt"
          {
            echo "profile_status=$profile_failed"
            echo "load_after_profile=$(cat /proc/loadavg)"
            echo "steal_ticks_before=$(awk '/^cpu /{print $9}' "$DIAG_DIR/proc-stat-before.txt")"
            echo "steal_ticks_after=$(awk '/^cpu /{print $9}' "$DIAG_DIR/proc-stat-after-profile.txt")"
            echo "finished_at=$(date -u +%FT%TZ)"
          } | tee -a "$DIAG_DIR/meta.txt"
          echo "status=$profile_failed" >> "$GITHUB_OUTPUT"

      - name: Collect worker hashes and source maps
        if: always()
        run: |
          worker_dir="$DIAG_DIR/worker"
          mkdir -p "$worker_dir"
          for file in benchmarks/.dsh-build/conversation-fold/conversation-fold.worker.js \
                      benchmarks/.dsh-build/conversation-fold/conversation-fold.worker.js.map; do
            [ -f "$file" ] || continue
            cp "$file" "$worker_dir/"
            sha256sum "$file" >> "$DIAG_DIR/worker-hashes.txt"
          done
          ls -la "$DIAG_DIR/worker" > "$DIAG_DIR/worker-listing.txt" 2>&1 || true

      - name: Upload bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: fold-cpu-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fold-cpu-profile
          retention-days: 14

      - name: Report separate exits
        if: always()
        run: |
          failed=0
          build_status='${{ steps.build.outputs.status }}'
          normal_status='${{ steps.normal.outputs.status }}'
          profile_status='${{ steps.profile.outputs.status }}'
          for entry in "build:$build_status" "normal:$normal_status"; do
            echo "${entry%%:*} exit=${entry#*:}"
            [ "${entry#*:}" = "0" ] || failed=1
          done
          echo "normal budget verdict uses the normal step exit above."
          echo "profile observation exit=$profile_status (nonzero makes this diagnostic red; not a budget verdict)"
          [ "$profile_status" = "0" ] || failed=1
          echo "profile timings are for call localization only; they are not a budget verdict."
          cat "$DIAG_DIR/meta.txt"
          echo "::group::normal bench log tail"
          tail -120 "$DIAG_DIR/normal-bench.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::profile status and stderr"
          cat "$DIAG_DIR/profile-status.log" 2>/dev/null || true
          for file in "$DIAG_DIR"/profile-*.stderr.log; do
            [ -f "$file" ] || continue
            echo "--- $file"
            tail -20 "$file"
          done
          echo "::endgroup::"
          exit "$failed"
