name: Fork coverage diagnostic

# Push-only, single Linux browser-overlap diagnostic on the existing reviewed
# diagnostic ref. The workflow head is the diagnostic commit; the measured
# baseline is the explicit ff894/tree396 checkout. A success/failure timeline
# patch is applied only to the cloud working copy, never committed. This is not
# a product candidate and does not change any required budget or assertion.
on:
  push:
    branches: [diagnostic/fork-coverage]

permissions:
  contents: read

concurrency:
  group: fork-coverage-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24.22.2'
  TESTED_HEAD: ff894d3e27b85011f609c50f5deef4e4570341e5
  TESTED_TREE: 39618f66d9dcd59c721de9e454888cdc4eeb779e
  TESTED_BENCH_SHA256: c83e6229fa2f5a39f2776c205d69eebe341ebc785bc2e57050e768009a1dfe98
  TESTED_BENCH_BLOB: 56fc53b60113a2ae5cbd6a45827e158563af3571
  TESTED_BENCH_AFTER_SHA256: 773c94844fe5680cb30ef432b41f68fcd20d651addd46992227f8de5d891f51e
  PLANNED_PATCH_SHA256: f84acac63d0c11d3536d44a8cbec8f8b739a8811db13082c01550cad87266d9f
  CSS_BEFORE_SHA256: ed939e63d6e6479b7b240a79c3231ade8c32f55235002ac33fc6a085e0497b60
  CSS_AFTER_SHA256: 58176c3b4eb5ac23355949ec143c5bcbf61b9f0553b4ba07ea044ec18bd63bd1
  CSS_PATCH_SHA256: 13b30914f88b062f19212dba8508443649bb2182f493d691a506d19b050e6319
  CSS_PATCH_B64: ''
  FLOW_HELPER_SHA256: 4bcea8d2dc58b547ebb200b189cdb6731c32eafd56ffa77d944ae5505980e263
  FLOW_HELPER_B64: ''

  DIAG_BENCH_PATCH_B64: ''

jobs:
  browser-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout measured baseline (explicit ff894)
        uses: actions/checkout@v7.0.1
        with:
          ref: ff894d3e27b85011f609c50f5deef4e4570341e5
          fetch-depth: 1
          persist-credentials: false

      - name: Record dual identity and fail closed on drift
        run: |
          DIAG="$RUNNER_TEMP/long-session-overlap"
          mkdir -p "$DIAG"
          tested_head=$(git rev-parse HEAD)
          tested_tree=$(git rev-parse HEAD^{tree})
          tested_blob=$(git hash-object benchmarks/long-session-browser/long-session.bench.ts)
          tested_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          css_sha=$(sha256sum packages/client/ui-chat/src/client/chat/ChatView.module.css | cut -d' ' -f1)
          diag_head='${{ github.sha }}'
          diag_tree=unavailable
          if git fetch --depth=1 origin "$diag_head" >/dev/null 2>&1; then
            diag_tree=$(git rev-parse "$diag_head^{tree}" 2>/dev/null || echo unavailable)
          fi
          {
            echo "diag_head=$diag_head"
            echo "diag_tree=$diag_tree"
            echo "tested_head=$tested_head"
            echo "tested_tree=$tested_tree"
            echo "tested_bench_blob=$tested_blob"
            echo "tested_bench_sha256=$tested_sha"
            echo "tested_css_sha256=$css_sha"
            echo "started_at=$(date -u +%FT%TZ)"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "cpu_model=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo "visible_cores=$(nproc)"
            echo "cgroup_cpu_max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unreadable)"
            echo "load_before=$(cat /proc/loadavg)"
            echo "tested_worktree_after_failure_patch_is_exact_396=false"
          } | tee "$DIAG/identity.txt"
          [ "$tested_head" = "$TESTED_HEAD" ] || { echo "tested HEAD drift" >&2; exit 1; }
          [ "$tested_tree" = "$TESTED_TREE" ] || { echo "tested tree drift" >&2; exit 1; }
          [ "$tested_blob" = "$TESTED_BENCH_BLOB" ] || { echo "benchmark blob drift" >&2; exit 1; }
          [ "$tested_sha" = "$TESTED_BENCH_SHA256" ] || { echo "benchmark source hash drift" >&2; exit 1; }
          [ "$css_sha" = "$CSS_BEFORE_SHA256" ] || { echo "baseline CSS hash drift" >&2; exit 1; }
          sha256sum \
            benchmarks/long-session-browser/long-session.bench.ts \
            benchmarks/long-session-browser/synthetic-history.ts \
            apps/web/tests/scaffold.ts \
            apps/web/tests/support.ts \
            benchmarks/support/calibration.ts \
            vitest.bench.config.ts \
            | tee -a "$DIAG/identity.txt"
          cp /proc/stat "$DIAG/proc-stat-before.txt"
          echo "DIAG_DIR=$DIAG" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Record tool versions
        run: |
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
          } | tee -a "$DIAG_DIR/identity.txt"

      - name: Apply success/failure timeline diagnostic patch (cloud copy)
        id: patch
        run: |
          set +e
          set -o pipefail
          printf '%s' "$DIAG_BENCH_PATCH_B64" | base64 -d | gzip -d > "$DIAG_DIR/planned.patch"
          status=$?
          before_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          cp benchmarks/long-session-browser/long-session.bench.ts "$DIAG_DIR/bench-before.ts"
          echo "bench_before_sha256=$before_sha" | tee -a "$DIAG_DIR/identity.txt"
          if [ "$status" = "0" ] && [ "$before_sha" = "$TESTED_BENCH_SHA256" ]; then
            git apply --check "$DIAG_DIR/planned.patch" && git apply "$DIAG_DIR/planned.patch"
            status=$?
          else
            status=1
          fi
          after_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          after_blob=$(git hash-object benchmarks/long-session-browser/long-session.bench.ts)
          cp benchmarks/long-session-browser/long-session.bench.ts "$DIAG_DIR/bench-after.ts"
          git diff -- benchmarks/long-session-browser/long-session.bench.ts > "$DIAG_DIR/applied.diff" || true
          echo "bench_after_sha256=$after_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "bench_blob_after_patch=$after_blob" | tee -a "$DIAG_DIR/identity.txt"
          planned_sha=$(sha256sum "$DIAG_DIR/planned.patch" | cut -d' ' -f1)
          echo "planned_patch_sha256=$planned_sha" | tee -a "$DIAG_DIR/identity.txt"
          [ "$planned_sha" = "$PLANNED_PATCH_SHA256" ] || status=1
          echo "applied_diff_sha256=$(sha256sum "$DIAG_DIR/applied.diff" | cut -d' ' -f1)" | tee -a "$DIAG_DIR/identity.txt"
          [ "$after_sha" = "$TESTED_BENCH_AFTER_SHA256" ] || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Install benchmark browser and hosted dependencies
        id: browser
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium 2>&1 | tee "$DIAG_DIR/browser-install.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Baseline build (original bench artifacts and Web shell)
        id: build
        continue-on-error: true
        run: |
          set +e
          pnpm run build:bench 2>&1 | tee "$DIAG_DIR/build.log"
          build_status=${PIPESTATUS[0]}
          pnpm run build:web 2>&1 | tee -a "$DIAG_DIR/build.log"
          web_status=${PIPESTATUS[0]}
          echo "build_bench=$build_status build_web=$web_status" | tee -a "$DIAG_DIR/identity.txt"
          [ "$build_status" = "0" ] && [ "$web_status" = "0" ]
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Baseline long-session-browser spec (3 samples)
        id: baseline
        if: steps.build.outputs.status == '0' && steps.browser.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          DSH_BENCH_REPORT_PHASE=all pnpm exec vitest run \
            --config vitest.bench.config.ts --no-file-parallelism --maxWorkers=1 \
            benchmarks/long-session-browser/long-session.bench.ts \
            2>&1 | tee "$DIAG_DIR/baseline-bench.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -d benchmarks/.dsh-report ]; then cp -R benchmarks/.dsh-report "$DIAG_DIR/baseline-report"; fi

      - name: Apply candidate CSS guard (cloud copy)
        id: css_patch
        if: steps.browser.outputs.status == '0'
        run: |
          set +e
          printf '%s' "$CSS_PATCH_B64" | base64 -d > "$DIAG_DIR/css.patch"
          status=$?
          css_before=$(sha256sum packages/client/ui-chat/src/client/chat/ChatView.module.css | cut -d' ' -f1)
          cp packages/client/ui-chat/src/client/chat/ChatView.module.css "$DIAG_DIR/css-before.css"
          echo "css_before_sha256=$css_before" | tee -a "$DIAG_DIR/identity.txt"
          if [ "$status" = "0" ] && [ "$css_before" = "$CSS_BEFORE_SHA256" ]; then
            git apply --check "$DIAG_DIR/css.patch" && git apply "$DIAG_DIR/css.patch"
            status=$?
          else
            status=1
          fi
          css_after=$(sha256sum packages/client/ui-chat/src/client/chat/ChatView.module.css | cut -d' ' -f1)
          cp packages/client/ui-chat/src/client/chat/ChatView.module.css "$DIAG_DIR/css-after.css"
          git diff -- packages/client/ui-chat/src/client/chat/ChatView.module.css > "$DIAG_DIR/css-applied.diff" || true
          css_patch_sha=$(sha256sum "$DIAG_DIR/css.patch" | cut -d' ' -f1)
          echo "css_after_sha256=$css_after" | tee -a "$DIAG_DIR/identity.txt"
          echo "css_patch_sha256=$css_patch_sha" | tee -a "$DIAG_DIR/identity.txt"
          [ "$css_patch_sha" = "$CSS_PATCH_SHA256" ] || status=1
          [ "$css_after" = "$CSS_AFTER_SHA256" ] || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Native CSS computed-margin helper (frozen author helper)
        id: helper
        if: steps.css_patch.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          printf '%s' "$FLOW_HELPER_B64" | base64 -d > "$DIAG_DIR/compare-flow-css.mjs"
          status=$?
          helper_sha=$(sha256sum "$DIAG_DIR/compare-flow-css.mjs" | cut -d' ' -f1)
          echo "flow_helper_sha256=$helper_sha" | tee -a "$DIAG_DIR/identity.txt"
          [ "$helper_sha" = "$FLOW_HELPER_SHA256" ] || status=1
          if [ "$status" = "0" ]; then
            node "$DIAG_DIR/compare-flow-css.mjs" > "$DIAG_DIR/css-helper.json" 2> "$DIAG_DIR/css-helper.err"
            status=$?
          else
            status=1
          fi
          echo "helper_status=$status" | tee -a "$DIAG_DIR/identity.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Candidate rebuild after CSS guard
        id: candidate_build
        if: steps.build.outputs.status == '0' && steps.css_patch.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          pnpm run build:bench 2>&1 | tee "$DIAG_DIR/candidate-build.log"
          build_status=${PIPESTATUS[0]}
          pnpm run build:web 2>&1 | tee -a "$DIAG_DIR/candidate-build.log"
          web_status=${PIPESTATUS[0]}
          echo "candidate_build_bench=$build_status candidate_build_web=$web_status" | tee -a "$DIAG_DIR/identity.txt"
          [ "$build_status" = "0" ] && [ "$web_status" = "0" ]
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Candidate long-session-browser spec (3 samples)
        id: candidate
        if: steps.candidate_build.outputs.status == '0' && steps.browser.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          DSH_BENCH_REPORT_PHASE=all pnpm exec vitest run \
            --config vitest.bench.config.ts --no-file-parallelism --maxWorkers=1 \
            benchmarks/long-session-browser/long-session.bench.ts \
            2>&1 | tee "$DIAG_DIR/candidate-bench.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -d benchmarks/.dsh-report ]; then cp -R benchmarks/.dsh-report "$DIAG_DIR/candidate-report"; fi

      - name: Upload bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: long-session-overlap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/long-session-overlap
          retention-days: 14

      - name: Report separate exits
        if: always()
        run: |
          failed=0
          patch_status='${{ steps.patch.outputs.status }}'
          browser_status='${{ steps.browser.outputs.status }}'
          build_status='${{ steps.build.outputs.status }}'
          baseline_status='${{ steps.baseline.outputs.status }}'
          css_status='${{ steps.css_patch.outputs.status }}'
          helper_status='${{ steps.helper.outputs.status }}'
          candidate_build_status='${{ steps.candidate_build.outputs.status }}'
          candidate_status='${{ steps.candidate.outputs.status }}'
          for entry in \
            "timeline-patch:$patch_status" \
            "browser:$browser_status" \
            "baseline-build:$build_status" \
            "baseline-bench:$baseline_status" \
            "css-patch:$css_status" \
            "native-css-helper:$helper_status" \
            "candidate-build:$candidate_build_status" \
            "candidate-bench:$candidate_status"; do
            echo "${entry%%:*} exit=${entry#*:}"
            [ "${entry#*:}" = "0" ] || failed=1
          done
          echo "Baseline and candidate are separate 3-sample runs; never combine them into one 6-sample median."
          echo "Baseline failure remains red but candidate diagnostics are retained; this is not an acceptance gate."
          cat "$DIAG_DIR/identity.txt"
          for name in baseline candidate; do
            echo "::group::${name} bench log tail"
            tail -160 "$DIAG_DIR/${name}-bench.log" 2>/dev/null || true
            echo "::endgroup::"
            echo "::group::${name} timeline diagnostics"
            grep -E 'long-session-browser/timeline|long-session-browser/overlap-failure' "$DIAG_DIR/${name}-bench.log" 2>/dev/null || true
            echo "::endgroup::"
          done
          echo "::group::native CSS helper"
          cat "$DIAG_DIR/css-helper.json" 2>/dev/null || true
          tail -20 "$DIAG_DIR/css-helper.err" 2>/dev/null || true
          echo "::endgroup::"
          exit "$failed"
