name: Fork coverage diagnostic

# Single ff894 baseline plus the frozen 148 full style-trace patch.
# This is diagnostic-only; it is not a product configuration or acceptance gate.
on:
  push:
    branches: [diagnostic/fork-coverage]

permissions:
  contents: read

concurrency:
  group: fork-coverage-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  PRIMARY_NODE_VERSION: '24.22.2'
  TESTED_HEAD: ff894d3e27b85011f609c50f5deef4e4570341e5
  TESTED_TREE: 39618f66d9dcd59c721de9e454888cdc4eeb779e
  TESTED_BENCH_SHA256: c83e6229fa2f5a39f2776c205d69eebe341ebc785bc2e57050e768009a1dfe98
  TESTED_BENCH_BLOB: 56fc53b60113a2ae5cbd6a45827e158563af3571
  BASELINE_CSS_SHA256: ed939e63d6e6479b7b240a79c3231ade8c32f55235002ac33fc6a085e0497b60
  STYLE_TRACE_BROWSER_VERSION: '149.0.7827.55'
  TESTED_BENCH_AFTER_SHA256: bc85f68ac9853f9c2d6d7af33b01e751a2506b9036e4a2d83bdc20a68ffd0cc7
  STYLE_TRACE_HELPER_SHA256: 76b0512168cd793092d3513859255107c9b0be7b889800b5fedaafc078cefdda
  PLANNED_PATCH_SHA256: 927a4cc65105470e524a8df99fde4e0fba27e36f3005910b8c3eb5b6eb8cbbbe
  DIAG_BENCH_PATCH_B64: ''

jobs:
  browser-overlap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout measured baseline (explicit ff894)
        uses: actions/checkout@v7.0.1
        with:
          ref: ff894d3e27b85011f609c50f5deef4e4570341e5
          fetch-depth: 1
          persist-credentials: false

      - name: Record identity and fail closed on drift
        run: |
          DIAG="$RUNNER_TEMP/long-session-overlap"
          mkdir -p "$DIAG"
          tested_head=$(git rev-parse HEAD)
          tested_tree=$(git rev-parse HEAD^{tree})
          tested_blob=$(git hash-object benchmarks/long-session-browser/long-session.bench.ts)
          tested_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          tested_css=$(sha256sum packages/client/ui-chat/src/client/chat/ChatView.module.css | cut -d' ' -f1)
          diag_head='${{ github.sha }}'
          diag_tree=unavailable
          if git fetch --depth=1 origin "$diag_head" >/dev/null 2>&1; then
            diag_tree=$(git rev-parse "$diag_head^{tree}" 2>/dev/null || echo unavailable)
          fi
          {
            echo "diag_head=$diag_head"
            echo "diag_tree=$diag_tree"
            echo "tested_head=$tested_head"
            echo "tested_tree=$tested_tree"
            echo "tested_bench_blob=$tested_blob"
            echo "tested_bench_sha256=$tested_sha"
            echo "tested_css_sha256=$tested_css"
            echo "started_at=$(date -u +%FT%TZ)"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "cpu_model=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //')"
            echo "visible_cores=$(nproc)"
            echo "cgroup_cpu_max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo unreadable)"
            echo "load_before=$(cat /proc/loadavg)"
            echo "tested_worktree_after_patch_is_exact_396=false"
          } | tee "$DIAG/identity.txt"
          [ "$tested_head" = "$TESTED_HEAD" ] || { echo "tested HEAD drift" >&2; exit 1; }
          [ "$tested_tree" = "$TESTED_TREE" ] || { echo "tested tree drift" >&2; exit 1; }
          [ "$tested_blob" = "$TESTED_BENCH_BLOB" ] || { echo "benchmark blob drift" >&2; exit 1; }
          [ "$tested_sha" = "$TESTED_BENCH_SHA256" ] || { echo "benchmark source hash drift" >&2; exit 1; }
          [ "$tested_css" = "$BASELINE_CSS_SHA256" ] || { echo "baseline CSS hash drift" >&2; exit 1; }
          sha256sum \
            benchmarks/long-session-browser/long-session.bench.ts \
            benchmarks/long-session-browser/synthetic-history.ts \
            apps/web/tests/scaffold.ts \
            apps/web/tests/support.ts \
            benchmarks/support/calibration.ts \
            vitest.bench.config.ts \
            | tee -a "$DIAG/identity.txt"
          cp /proc/stat "$DIAG/proc-stat-before.txt"
          echo "DIAG_DIR=$DIAG" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Record tool versions
        run: |
          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
          } | tee -a "$DIAG_DIR/identity.txt"

      - name: Apply frozen full style-trace patch (cloud copy)
        id: patch
        run: |
          set +e
          set -o pipefail
          printf '%s' "$DIAG_BENCH_PATCH_B64" | base64 -d | gzip -d > "$DIAG_DIR/planned.patch"
          status=$?
          before_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          cp benchmarks/long-session-browser/long-session.bench.ts "$DIAG_DIR/bench-before.ts"
          echo "bench_before_sha256=$before_sha" | tee -a "$DIAG_DIR/identity.txt"
          if [ "$status" = "0" ] && [ "$before_sha" = "$TESTED_BENCH_SHA256" ]; then
            git apply --check "$DIAG_DIR/planned.patch" && git apply "$DIAG_DIR/planned.patch"
            status=$?
          else
            status=1
          fi
          after_sha=$(sha256sum benchmarks/long-session-browser/long-session.bench.ts | cut -d' ' -f1)
          helper_sha=$(sha256sum benchmarks/long-session-browser/style-trace.ts | cut -d' ' -f1)
          after_blob=$(git hash-object benchmarks/long-session-browser/long-session.bench.ts)
          cp benchmarks/long-session-browser/long-session.bench.ts "$DIAG_DIR/bench-after.ts"
          cp benchmarks/long-session-browser/style-trace.ts "$DIAG_DIR/style-trace.ts"
          git diff -- benchmarks/long-session-browser > "$DIAG_DIR/applied.diff" || true
          planned_sha=$(sha256sum "$DIAG_DIR/planned.patch" | cut -d' ' -f1)
          echo "bench_after_sha256=$after_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "style_trace_helper_sha256=$helper_sha" | tee -a "$DIAG_DIR/identity.txt"
          echo "bench_blob_after_patch=$after_blob" | tee -a "$DIAG_DIR/identity.txt"
          echo "planned_patch_sha256=$planned_sha" | tee -a "$DIAG_DIR/identity.txt"
          [ "$planned_sha" = "$PLANNED_PATCH_SHA256" ] || status=1
          [ "$after_sha" = "$TESTED_BENCH_AFTER_SHA256" ] || status=1
          [ "$helper_sha" = "$STYLE_TRACE_HELPER_SHA256" ] || status=1
          css_after=$(sha256sum packages/client/ui-chat/src/client/chat/ChatView.module.css | cut -d' ' -f1)
          echo "css_after_patch_sha256=$css_after" | tee -a "$DIAG_DIR/identity.txt"
          [ "$css_after" = "$BASELINE_CSS_SHA256" ] || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Install benchmark browser and hosted dependencies
        id: browser
        continue-on-error: true
        run: |
          set +e
          pnpm --filter @deepseek-ai/dsh-benchmarks exec playwright install --with-deps chromium 2>&1 | tee "$DIAG_DIR/browser-install.log"
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build benchmark artifacts and Web shell
        id: build
        continue-on-error: true
        run: |
          set +e
          pnpm run build:bench 2>&1 | tee "$DIAG_DIR/build.log"
          build_status=${PIPESTATUS[0]}
          pnpm run build:web 2>&1 | tee -a "$DIAG_DIR/build.log"
          web_status=${PIPESTATUS[0]}
          echo "build_bench=$build_status build_web=$web_status" | tee -a "$DIAG_DIR/identity.txt"
          [ "$build_status" = "0" ] && [ "$web_status" = "0" ]
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Normal long-session-browser spec (3 samples, first-sample trace)
        id: bench
        if: steps.build.outputs.status == '0' && steps.browser.outputs.status == '0'
        continue-on-error: true
        run: |
          set +e
          # vitest.bench.config.ts has no retry setting; this remains a single run.
          DSH_STYLE_TRACE=1 DSH_BENCH_REPORT_PHASE=all pnpm exec vitest run \
            --config vitest.bench.config.ts --no-file-parallelism --maxWorkers=1 \
            benchmarks/long-session-browser/long-session.bench.ts \
            2>&1 | tee "$DIAG_DIR/normal-bench.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -d benchmarks/.dsh-report ]; then cp -R benchmarks/.dsh-report "$DIAG_DIR/normal-report"; fi

      - name: Verify bounded single style-trace artifacts
        id: trace
        if: always()
        continue-on-error: true
        run: |
          set +e
          dir="$DIAG_DIR/style-trace"
          trace="$dir/style-trace-sample-0.json"
          meta="$dir/style-trace-sample-0.metadata.json"
          status=0
          [ -f "$trace" ] || status=1
          [ -f "$meta" ] || status=1
          if [ -f "$trace" ]; then
            bytes=$(stat -c%s "$trace")
            echo "style_trace_bytes=$bytes" | tee -a "$DIAG_DIR/identity.txt"
            [ "$bytes" -le 33554432 ] || status=1
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[process.argv.length - 1], "utf8"))' "$trace" || status=1
          fi
          if [ -f "$meta" ]; then
            node -e '
              const fs = require("node:fs");
              const m = JSON.parse(fs.readFileSync(process.argv[process.argv.length - 1], "utf8"));
              const problems = [];
              if (m.sample !== 0) problems.push("sample");
              if (m.bufferSizeKb !== 16384) problems.push("buffer");
              if (m.maxCaptureMs !== 10000) problems.push("capture");
              if (m.maxOutputBytes !== 33554432) problems.push("export");
              if (m.browserVersion !== "149.0.7827.55") problems.push("browser-version");
              if (m.traceFormat !== undefined && m.traceFormat !== "json") problems.push("format");
              if (m.streamCompression !== undefined && m.streamCompression !== "none") problems.push("compression");
              if (m.bytes > 33554432) problems.push("bytes");
              if (m.truncated) problems.push("truncated");
              if (m.dataLossOccurred || (m.bufferUsage?.maxPercentFull ?? 0) >= 1) problems.push("dataLoss");
              if (m.completion !== "normal") problems.push("completion=" + String(m.completion));
              if (!m.windowComplete) problems.push("window");
              if ((m.cleanupErrors || []).length > 0) problems.push("cleanup");
              if (m.parseError !== undefined) problems.push("parse");
              if (m.readError !== undefined) problems.push("read");
              console.log("trace_meta=" + JSON.stringify({ browserVersion: m.browserVersion, expectedBrowserVersion: m.expectedBrowserVersion, bufferSizeKb: m.bufferSizeKb, maxCaptureMs: m.maxCaptureMs, maxOutputBytes: m.maxOutputBytes, traceFormat: m.traceFormat === undefined ? "未回传" : m.traceFormat, streamCompression: m.streamCompression === undefined ? "未回传" : m.streamCompression, bytes: m.bytes, truncated: m.truncated, dataLossOccurred: m.dataLossOccurred, completion: m.completion, windowComplete: m.windowComplete, selectorStatsFound: m.selectorStatsFound, attributionReady: m.attributionReady }));
              if (problems.length > 0) { console.error("trace_meta_problems=" + problems.join(",")); process.exit(1); }
            ' "$meta" || status=1
          fi
          count=$(find "$dir" -maxdepth 1 -type f -name 'style-trace-sample-*.json' ! -name '*.metadata.json' 2>/dev/null | wc -l)
          echo "style_trace_artifacts=$count" | tee -a "$DIAG_DIR/identity.txt"
          [ "$count" -eq 1 ] || status=1
          ls -l "$dir" 2>/dev/null || true
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: long-session-overlap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/long-session-overlap
          retention-days: 14

      - name: Report separate exits
        if: always()
        run: |
          failed=0
          patch_status='${{ steps.patch.outputs.status }}'
          browser_status='${{ steps.browser.outputs.status }}'
          build_status='${{ steps.build.outputs.status }}'
          bench_status='${{ steps.bench.outputs.status }}'
          trace_status='${{ steps.trace.outputs.status }}'
          for entry in "patch:$patch_status" "browser:$browser_status" "build:$build_status" "bench:$bench_status" "trace:$trace_status"; do
            echo "${entry%%:*} exit=${entry#*:}"
            [ "${entry#*:}" = "0" ] || failed=1
          done
          echo "The benchmark/trace exits are diagnostic only; no PASS acceptance is claimed."
          cat "$DIAG_DIR/identity.txt"
          echo "::group::benchmark log tail"
          tail -160 "$DIAG_DIR/normal-bench.log" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::style-trace artifacts"
          find "$DIAG_DIR/style-trace" -maxdepth 1 -type f -ls 2>/dev/null || true
          cat "$DIAG_DIR/style-trace/style-trace-sample-0.metadata.json" 2>/dev/null || true
          echo "::endgroup::"
          exit "$failed"
